
      - name: Detect and prepare Android project
        run: |
          set -e

          echo "=== Searching for Android project ==="

          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts -o \
            -name app.json -o \
            -name package.json \
          \) -not -path "*/node_modules/*" | head -200

          if find extracted -type f -name gradlew \
              -not -path "*/node_modules/*" | grep -q .; then
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper missing."
            echo "Checking project type..."

            if [ -f extracted/Launcherx-main/package.json ]; then
              node -e "
                const p = require('./extracted/Launcherx-main/package.json');
                console.log('Project:', p.name || 'Unnamed');
                console.log('Scripts:', JSON.stringify(p.scripts || {}));
                console.log('Dependencies:', JSON.stringify(p.dependencies || {}));
              "
            fi

            echo "Automatic detection completed."
          fi
