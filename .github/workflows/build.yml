
name: Build LauncherX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LauncherX-TV.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=$(find source -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          npx @react-native-community/cli@15.1.3 init PS5Launcher --version 0.76.9 --skip-install

      - name: Copy LauncherX source files
        run: |
          cd PS5Launcher

          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/package.json" package.json
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/app.json" app.json
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/babel.config.js" babel.config.js
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/metro.config.js" metro.config.js
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/index.js" index.js
          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/App.js" App.js

          cp -r "$GITHUB_WORKSPACE/$PROJECT_DIR/src" src

          if [ ! -d "$GITHUB_WORKSPACE/$PROJECT_DIR/android-template/app/src/main" ]; then
            echo "ERROR: Android template not found."
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/$PROJECT_DIR/android-template/app/src/main/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml

          cp -r "$GITHUB_WORKSPACE/$PROJECT_DIR/android-template/app/src/main/java/com/ps5launcher/." android/app/src/main/java/com/ps5launcher/

          cp -r "$GITHUB_WORKSPACE/$PROJECT_DIR/android-template/app/src/main/res/." android/app/src/main/res/

            - name: Install dependencies
        run: |
          cd PS5Launcher
          npm install --legacy-peer-deps

      - name: Build debug APK
        run: |
          cd PS5Launcher/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherX-APK
          path: PS5Launcher/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
