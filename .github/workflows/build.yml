
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking ZIP files..."
          find . -type f -name "*.zip" -print

