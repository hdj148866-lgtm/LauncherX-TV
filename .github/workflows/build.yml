name: Build LauncherX APK

on:
workflow_dispatch:
push:
paths:
- 'Launcherx-main.zip'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Extract project
    run: |
      set -e
      mkdir -p extracted
      unzip -o Launcherx-main.zip -d extracted
      echo "=== Project files ==="
      find extracted -maxdepth 4 -type f \( -name package.json -o -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name app.json -o -name app.config.js -o -name app.config.ts \) -not -path "*/node_modules/*" | head -200

  - name: Inspect project configuration
    run: |
      echo "=== package.json ==="
      find extracted -name package.json -not -path "*/node_modules/*" -print
      PACKAGE=$(find extracted -name package.json -not -path "*/node_modules/*" | head -1)
      if [ -n "$PACKAGE" ]; then
        node -e 'const p=require("./"+process.argv[1]); console.log(JSON.stringify({name:p.name,scripts:p.scripts,dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))' "$PACKAGE"
      fi
      echo "=== Android Gradle files ==="
      find extracted -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -not -path "*/node_modules/*" -print
