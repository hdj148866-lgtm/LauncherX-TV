
name: Build LauncherX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project files
        run: |
          echo "Checking project structure..."
          test -f PS5Launcher/package.json || {
            echo "ERROR: PS5Launcher/package.json not found"
            exit 1
          }
          test -f PS5Launcher/android/gradlew || {
            echo "ERROR: Android Gradle wrapper not found"
            exit 1
          }
          test -f PS5Launcher/android/app/build.gradle || {
            echo "ERROR: app/build.gradle not found"
            exit 1
          }

      - name: Install dependencies
        working-directory: PS5Launcher
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Configure Android package
        working-directory: PS5Launcher
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'android/app/build.gradle';
          const gradle = fs.readFileSync(file, 'utf8');

          const match = gradle.match(
            /applicationId\s+["']([^"']+)["']/
          );

          if (!match) {
            console.error(
              'ERROR: applicationId not found in build.gradle'
            );
            process.exit(1);
          }

          const packageName = match[1];

          fs.writeFileSync(
            'react-native.config.js',
            `module.exports = {
              project: {
                android: {
                  packageName: '${packageName}',
                },
              },
            };\n`
          );

          console.log('Android package:', packageName);
          NODE

      - name: Verify React Native configuration
        working-directory: PS5Launcher
        run: |
          npx react-native config > rn-config.json

          node <<'NODE'
          const config = require('./rn-config.json');
          const name = config.project?.android?.packageName;

          if (!name) {
            console.error(
              'ERROR: React Native Android packageName is missing'
            );
            process.exit(1);
          }

          console.log('Verified Android package:', name);
          NODE

      - name: Build APK
        working-directory: PS5Launcher/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherX-APK
          path: PS5Launcher/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
