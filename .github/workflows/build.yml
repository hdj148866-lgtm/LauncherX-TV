
name: Build LauncherX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Locate project files
        run: |
          echo "Repository contents:"
          ls -la

          echo "Searching for package.json..."
          find . -type f -name package.json \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | head -50

          echo "Searching for Gradle wrapper..."
          find . -type f -name gradlew \
            -not -path "*/node_modules/*" | head -30

          echo "Searching for project ZIP files..."
          find . -maxdepth 3 -type f -name "*.zip"

      - name: Stop and report project location
        run: |
          echo "Project location scan completed."
          echo "Check the log above to identify the actual project folder."
          exit 1

