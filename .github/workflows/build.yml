
name: Build LauncherX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PS5Launcher/package-lock.json

      - name: Install dependencies
        working-directory: PS5Launcher
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "ERROR: package.json not found"
            exit 1
          fi

      - name: Configure React Native Android package
        working-directory: PS5Launcher
        run: |
          test -f android/app/build.gradle || {
            echo "ERROR: android/app/build.gradle not found"
            exit 1
          }

          node <<'NODE'
          const fs = require('fs');

          const gradle = fs.readFileSync(
            'android/app/build.gradle', 'utf8'
          );

          const match = gradle.match(
            /applicationId\s+["']([^"']+)["']/
          );

          if (!match) {
            console.error(
              'ERROR: applicationId not found in build.gradle'
            );
            process.exit(1);
          }

          const packageName = match[1];

          fs.writeFileSync(
            'react-native.config.js',
            `module.exports = {
              project: {
                android: {
                  packageName: '${packageName}',
                },
              },
            };\n`
          );

          console.log('Android package:', packageName);
          NODE

      - name: Verify React Native configuration
        working-directory: PS5Launcher
        run: |
          npx react-native config > rn-config.json
          node -e "
            const c = require('./rn-config.json');
            if (!c.project?.android?.packageName) {
              console.error('Android packageName is missing');
              process.exit(1);
            }
            console.log('Package:', c.project.android.packageName);
          "

      - name: Build APK
        working-directory: PS5Launcher/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherX-APK
          path: PS5Launcher/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
