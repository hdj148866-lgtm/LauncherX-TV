
name: Build LauncherX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Launcherx-main.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          set -e
          mkdir extracted
          unzip -q Launcherx-main.zip -d extracted
          echo "=== BUILD FILES ==="
          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

      
      - name: Inspect extracted project
        run: |
          echo "=== ROOT FILES ==="
          find extracted -maxdepth 3 -type f | head -150
          echo "=== PROJECT MARKERS ==="
          find extracted -type f \( \
            -name package.json -o \
            -name app.json -o \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name AndroidManifest.xml \
          \) -print
          

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LauncherX-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
